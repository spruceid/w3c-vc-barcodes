[package]
name = "w3c-vc-barcodes"
version = "0.1.0"
edition = "2021"
rust-version = "1.88.0"
authors = ["Spruce Systems, Inc."]
license = "MIT OR Apache-2.0"
description = "W3C VC Barcodes"
repository = "https://github.com/spruceid/w3c-vc-barcodes/"
documentation = "https://docs.rs/w3c-vc-barcodes/"

[dependencies]
iref = { version = "3.1.4", features = ["serde"] }
static-iref = "3.0.0"
lazy_static = "1.5.0"
serde = { version = "1.0.203", features = ["derive"] }
sha2 = "0.10.8"
ssi = { version = "0.15", features = ["secp256r1", "secp384r1"] }
json-syntax = "0.12.5"
cbor-ld = { git = "https://github.com/spruceid/cbor-ld.git", rev = "18b8219" }
thiserror = "1.0.61"
csv = "1.3.0"

[dev-dependencies]
async-std = { version = "1.12.0", features = ["attributes"] }
hex = "0.4.3"
qrcode = "0.14.1"
